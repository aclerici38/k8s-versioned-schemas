# Install everything with `mise install`. Run `mise tasks` to list tasks,
# `mise run <task>` to run one. Multi-line tasks live in ./.mise-tasks.

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
# CRD extraction from upstream charts and manifests
helm = "4.2.4"
yq = "4.53.3"
kustomize = "5.8.1"

# openapi2jsonschema.py (needs pyyaml) and the site/redirect generators
python = "3.14.7"
uv = "0.12.4"

# Release creation
gh = "2.97.0"

[env]
# Consumed by openapi2jsonschema.py; the group prefix is stripped back off in
# gen-schemas after it has been recorded in _groups.txt.
FILENAME_FORMAT = "{fullgroup}_{kind}_{version}"
# Build uv's ephemeral envs from mise's python instead of letting uv download
# an interpreter of its own, so the python version stays pinned in mise.lock.
UV_PYTHON_PREFERENCE = "only-system"

[tasks.clean]
description = "Remove the generated crds/ and schemas/ trees"
run = "rm -rf crds schemas"
