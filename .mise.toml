# Install everything with `mise install`. Run `mise tasks` to list tasks,
# `mise run <task>` to run one. Multi-line tasks live in ./.mise-tasks.

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
# CRD extraction from upstream charts and manifests
helm = "4.2.4"
yq = "4.53.6"
kustomize = "5.8.1"

# OCI chart version discovery.
"aqua:oras-project/oras" = "1.3.3"

# Flux render for CRD discovery
"github:home-operations/flate" = "v0.6.1"

# CRD -> JSON schema conversion
"aqua:sholdee/crd-schema-publisher" = "2026.815.170632"

[tasks.clean]
description = "Remove the generated crds/ and schemas/ trees"
run = "rm -rf crds schemas"
