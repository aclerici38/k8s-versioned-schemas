name: deploy-schemas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - ".mise.toml"
      - ".mise-tasks/**"
      - "worker.js"
      - "index.template.html"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: deploy-schemas
  cancel-in-progress: true

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.9.17"
          install: false
          cache: false

      - name: Build site
        run: mise run build-site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy schemas/ --project-name=k8s-versioned-schemas
