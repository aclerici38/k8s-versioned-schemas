name: discover

# Sweeps the k8s-at-home/kubesearch topics once, then opens one PR per newly
# discovered app and one issue for the CRD groups no app covers.
on:
  schedule:
    - cron: "38 6 * * *"
  workflow_dispatch:
    inputs:
      min_repos:
        description: "Ignore charts run by fewer than this many clusters"
        required: false
        default: "1"
      min_crd_repos:
        description: "Ignore CRD groups run by fewer than this many clusters"
        required: false
        default: "1"
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discover-apps
  cancel-in-progress: false

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  list-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sweep topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.mise-tasks/discover/repos > repos.txt

      - name: Upload repo list
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repos
          path: repos.txt

  discover-apps:
    needs: list-repos
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Labels are an Issues resource even when applied to a PR.
          permission-issues: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.8.6"
          install_args: "helm yq aqua:oras-project/oras"

      - name: Download repo list
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repos

      - name: Discover Apps
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MIN_REPOS: ${{ inputs.min_repos || '1' }}
          REPOS_FILE: repos.txt
        run: mise run discover:apps

      - name: Open a PR per new App
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "200541989+${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          for f in $(git ls-files --others --exclude-standard apps/); do
            APP="$(basename "$f" .yaml)"
            BRANCH="discover/${APP}"

            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "Branch $BRANCH already exists, skipping $APP"
              continue
            fi

            CLUSTERS="$(grep -oP '(?<=referenced by )\d+' "$f" || echo '?')"
            CHART="$(yq -r '.helm.chartUrl' "$f")"

            # Before the push: a branch pushed without a PR would still trip the
            # ls-remote guard above and suppress the app on every later run.
            if [ "$DRY_RUN" = true ]; then
              echo "would open $BRANCH -- $CHART ($CLUSTERS clusters)"
              continue
            fi

            git checkout -q -b "$BRANCH" origin/main
            git add "$f"
            git commit -q -m "feat(apps): add ${APP}"
            git push -q origin "$BRANCH"

            gh pr create \
              --base main \
              --head "$BRANCH" \
              --label discover \
              --title "feat(apps): add ${APP}" \
              --body "$(cat <<EOF
          Discovered by \`discover-apps\`, which sweeps every repo carrying the
          [k8s-at-home](https://github.com/topics/k8s-at-home) or
          [kubesearch](https://github.com/topics/kubesearch) topic.

          | | |
          |---|---|
          | Chart | \`${CHART}\` |
          | Referenced by | ${CLUSTERS} clusters |

          The \`generate-schemas\` run on this PR comments the schema diff. **If it reports
          no schema changes, close this PR** and add \`${APP}\` to \`.github/discover-ignore.txt\`
          so it stops being proposed.
          EOF
              )"

            git checkout -q main
          done

  find-crds:
    needs: list-repos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.8.6"
          install_args: "yq github:home-operations/flate"

      - name: Download repo list
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repos

      # Renders untrusted third-party manifests, so it runs on the read-only
      # default token -- the App token is minted in the job that files the issue.
      - name: Find CRDs
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_REPOS: ${{ inputs.min_crd_repos || '3' }}
          REPOS_FILE: repos.txt
        run: mise run discover:crds

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crd-report
          path: crd-report.tsv

  file-crd-issue:
    # After discover-apps so a group it just opened a PR for is not also an issue.
    needs: [discover-apps, find-crds]
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_KEY }}
          permission-issues: write
          permission-pull-requests: read

      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crd-report

      - name: Open an issue for the untracked groups
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          # Every group already proposed, whether the issue is open or closed --
          # a closed one was triaged, so it stays suppressed.
          gh issue list --label discover-crds --state all --limit 100 --json body --jq '.[].body' |
            grep -o '<!-- groups: [^>]*' | sed 's/<!-- groups: //' | tr ' ' '\n' | sort -u >seen.txt || true
          gh pr list --label discover --state open --limit 100 --json headRefName \
            --jq '.[].headRefName | sub("^discover/"; "")' | sort -u >proposed.txt || true

          awk -F'\t' '
            FILENAME == "seen.txt"     { s[$0]; next }
            FILENAME == "proposed.txt" { p[$0]; next }
            $1 in s { next }
            { n = split($5, c, " "); for (i = 1; i <= n; i++) if (c[i] in p) next; print }
          ' seen.txt proposed.txt crd-report.tsv >new.tsv

          COUNT=$(wc -l <new.tsv | tr -d ' ')
          [ "$COUNT" -gt 0 ] || { echo "No untracked CRD groups"; exit 0; }

          {
            echo "\`flate\` rendered every repo carrying the [k8s-at-home](https://github.com/topics/k8s-at-home)"
            echo "or [kubesearch](https://github.com/topics/kubesearch) topic. These CRD groups have no schema here."
            echo
            awk -F'\t' '{
              printf "### `%s`%s\n\n", $1, ($2 == "partial" ? " -- group partly covered already" : "")
              printf "Run by **%s** clusters. Kinds: `%s`\n\n", $3, $4
              n = split($6, p, ";")
              for (i = 1; i <= n; i++) printf "- %s\n", p[i]
              printf "\n"
            }' new.tsv
            echo "Every group listed here is suppressed from later runs whether this issue is open or"
            echo "closed, so close it once triaged. Add a group to \`.github/crd-ignore.txt\` to pre-empt it."
            printf '<!-- groups: %s -->\n' "$(cut -f1 new.tsv | paste -sd' ' -)"
          } >body.md

          if [ "$DRY_RUN" = true ]; then
            echo "would open an issue for $COUNT groups:"
            cat body.md
            exit 0
          fi

          gh label create discover-crds --color 1d76db --force \
            --description "Opened automatically by the find-crds job"
          gh issue create \
            --label discover-crds \
            --title "$COUNT CRD groups without schemas ($(date -u +%Y-%m-%d))" \
            --body-file body.md
