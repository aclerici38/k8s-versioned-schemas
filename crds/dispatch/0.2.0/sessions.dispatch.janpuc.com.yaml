---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: sessions.dispatch.janpuc.com
spec:
  group: dispatch.janpuc.com
  names:
    categories:
      - dispatch
    kind: Session
    listKind: SessionList
    plural: sessions
    shortNames:
      - sess
    singular: session
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.agentRef.name
          name: Agent
          type: string
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .status.model
          name: Model
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: 'Session is the logbook entry: one budgeted, recorded run.'
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: 'SessionSpec defines one run: who, on what input, and where it came from.'
              properties:
                agentRef:
                  description: AgentRef names the Agent executing this session.
                  properties:
                    name:
                      description: Name of the referenced object.
                      minLength: 1
                      type: string
                  required:
                    - name
                  type: object
                input:
                  description: Input is the rendered task.
                  properties:
                    prompt:
                      description: |-
                        Prompt is the fully rendered task prompt, event payload fenced as
                        untrusted data.
                      type: string
                  type: object
                provenance:
                  description: Provenance records the originating trigger and event.
                  properties:
                    cliVersion:
                      description: CLIVersion is the agent CLI version inside the runner.
                      type: string
                    eventType:
                      description: EventType is the normalized CloudEvent type, e.g. alertmanager.firing.
                      type: string
                    fingerprint:
                      description: Fingerprint is the dedupe fingerprint of the originating event.
                      type: string
                    runnerImageDigest:
                      description: RunnerImageDigest pins the runner image that executed the session.
                      type: string
                    triageVerdict:
                      description: TriageVerdict is the triage classification, when triage ran.
                      type: string
                    trigger:
                      description: Trigger is the Trigger that created this session.
                      type: string
                  type: object
              required:
                - agentRef
              type: object
            status:
              description: SessionStatus is the immutable record a finished session leaves behind.
              properties:
                a2aTaskState:
                  description: A2ATaskState is the phase in A2A vocabulary, for the gateway edge.
                  type: string
                artifacts:
                  description: Artifacts locate the transcript, report, and branches.
                  properties:
                    branches:
                      description: |-
                        Branches pushed by the session, always matching the agent's allowed
                        patterns.
                      items:
                        type: string
                      type: array
                    report:
                      description: Report is the URI of the session's report, when one was produced.
                      type: string
                    transcript:
                      description: Transcript is the URI of the stream-json transcript.
                      type: string
                  type: object
                completedAt:
                  description: CompletedAt is when the session reached a terminal phase.
                  format: date-time
                  type: string
                conditions:
                  description: Conditions describe scheduling and execution detail.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                followUps:
                  description: FollowUps are runner-proposed next actions.
                  items:
                    type: string
                  type: array
                jobName:
                  description: JobName is the Job executing this session.
                  type: string
                model:
                  description: Model that served the session.
                  type: string
                phase:
                  description: Phase is the lifecycle state.
                  enum:
                    - Submitted
                    - Working
                    - InputRequired
                    - Completed
                    - Failed
                    - Canceled
                    - Rejected
                    - Suppressed
                  type: string
                startedAt:
                  description: StartedAt is when execution began.
                  format: date-time
                  type: string
                summary:
                  description: Summary is the runner-reported outcome in one paragraph.
                  type: string
                usage:
                  description: Usage is the metered spend, reported by the runner shim.
                  properties:
                    apiEquivalentUSD:
                      anyOf:
                        - type: integer
                        - type: string
                      description: APIEquivalentUSD is the estimated cost had this run been API-billed.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    billing:
                      description: Billing is subscription or api.
                      enum:
                        - subscription
                        - api
                      type: string
                    cacheReadTokens:
                      description: CacheReadTokens served from prompt cache.
                      format: int64
                      type: integer
                    inputTokens:
                      description: InputTokens consumed, excluding cache reads.
                      format: int64
                      type: integer
                    outputTokens:
                      description: OutputTokens produced.
                      format: int64
                      type: integer
                    turns:
                      description: Turns the session used.
                      format: int32
                      type: integer
                  type: object
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
