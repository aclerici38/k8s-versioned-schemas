---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: workspaces.dispatch.janpuc.com
spec:
  group: dispatch.janpuc.com
  names:
    categories:
      - dispatch
    kind: Workspace
    listKind: WorkspaceList
    plural: workspaces
    shortNames:
      - ws
    singular: workspace
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.pvcName
          name: PVC
          type: string
        - jsonPath: .status.activeSession
          name: Active
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: 'Workspace is a project home on the NAS: git origin plus disposable cache.'
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: 'WorkspaceSpec defines a project home: origin, storage, caches, lease.'
              properties:
                caches:
                  description: |-
                    Caches selects shared package-manager caches mounted into sessions
                    (ADR-0006), e.g. node, uv, go.
                  items:
                    type: string
                  type: array
                lease:
                  description: Lease serializes workspace access.
                  properties:
                    singleActiveSession:
                      description: |-
                        SingleActiveSession allows at most one running session in this
                        workspace at a time (ADR-0005).
                      type: boolean
                  type: object
                origin:
                  description: Origin is the project's git remote.
                  properties:
                    defaultBranch:
                      default: main
                      description: DefaultBranch is the branch sessions base their work on.
                      type: string
                    gitUrl:
                      description: GitURL is the clone URL of the project remote.
                      minLength: 1
                      type: string
                  required:
                    - gitUrl
                  type: object
                retention:
                  description: Retention bounds scratch lifetime.
                  properties:
                    scratch:
                      description: Scratch is how long session scratch directories are retained.
                      type: string
                  type: object
                storage:
                  description: Storage shapes the backing PVC.
                  properties:
                    accessModes:
                      description: |-
                        AccessModes of the claim; defaults to ReadWriteOnce, which the
                        single-active-session lease is designed around. Set ReadWriteMany when
                        the storage class supports shared attach.
                      items:
                        type: string
                      type: array
                    size:
                      anyOf:
                        - type: integer
                        - type: string
                      description: Size of the workspace volume.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    storageClassName:
                      description: StorageClassName selects the backing storage class.
                      type: string
                  required:
                    - size
                  type: object
              required:
                - origin
                - storage
              type: object
            status:
              description: WorkspaceStatus is the observed state of a Workspace.
              properties:
                activeSession:
                  description: ActiveSession holds the lease when SingleActiveSession is set.
                  type: string
                conditions:
                  description: Conditions describe provisioning state.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                pvcName:
                  description: PVCName is the provisioned backing PersistentVolumeClaim.
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
