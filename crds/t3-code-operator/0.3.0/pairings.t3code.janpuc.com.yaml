---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: pairings.t3code.janpuc.com
spec:
  group: t3code.janpuc.com
  names:
    kind: Pairing
    listKind: PairingList
    plural: pairings
    shortNames:
      - pair
    singular: pairing
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.workstation
          name: Workstation
          type: string
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=="Ready")].reason
          name: State
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              properties:
                baseUrl:
                  maxLength: 2048
                  pattern: ^https?://[^[:space:]/?#]+(/[^[:space:]?#]*)?$
                  type: string
                devices:
                  items:
                    pattern: ^[A-Za-z0-9][A-Za-z0-9 _.-]{0,62}$
                    type: string
                  maxItems: 16
                  type: array
                  x-kubernetes-list-type: set
                ttl:
                  default: 30m
                  type: string
                workstationRef:
                  properties:
                    name:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                      type: string
                  required:
                    - name
                  type: object
              type: object
              x-kubernetes-validations:
                - message: ttl must be at least one minute
                  rule: '!has(self.ttl) || duration(self.ttl) >= duration(''1m'')'
            status:
              properties:
                baseUrl:
                  maxLength: 2048
                  type: string
                conditions:
                  items:
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  maxItems: 16
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                links:
                  items:
                    properties:
                      code:
                        maxLength: 64
                        type: string
                      device:
                        maxLength: 64
                        type: string
                      expiresAt:
                        format: date-time
                        type: string
                      issuedAt:
                        format: date-time
                        type: string
                      message:
                        maxLength: 1024
                        type: string
                      pairingId:
                        maxLength: 128
                        type: string
                      session:
                        properties:
                          connected:
                            type: boolean
                          deviceType:
                            maxLength: 64
                            type: string
                          expiresAt:
                            format: date-time
                            type: string
                          id:
                            maxLength: 128
                            type: string
                          issuedAt:
                            format: date-time
                            type: string
                          lastConnectedAt:
                            format: date-time
                            type: string
                        required:
                          - connected
                          - id
                        type: object
                      state:
                        enum:
                          - Pending
                          - Issued
                          - Paired
                          - Expired
                          - Revoked
                          - Failed
                        type: string
                      url:
                        maxLength: 4096
                        type: string
                    required:
                      - device
                      - state
                    type: object
                  maxItems: 16
                  type: array
                  x-kubernetes-list-map-keys:
                    - device
                  x-kubernetes-list-type: map
                observedGeneration:
                  format: int64
                  type: integer
                workstation:
                  maxLength: 253
                  type: string
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
