---
# The argo-workflows chart only templates minified CRDs, the full ones are applied by a
# hook Job from the crdinstaller image. Read the full CRDs from upstream instead.
# renovate: datasource=github-releases depName=argoproj/argo-workflows
version: v4.1.4
githubFolders:
  - https://github.com/argoproj/argo-workflows/tree/${VERSION}/manifests/base/crds/full
